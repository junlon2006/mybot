name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libssl-dev clang-format
      - name: Configure
        run: cmake -S . -B build -DCONFIG_PLATFORM=linux -DMYBOT_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Format check
        run: |
          find include src platforms examples tests -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror {} +
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git log --no-merges --format='%s' "$range" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | ./githooks/commit-msg --subject-only >/dev/null
          done
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git log --no-merges --format='%s' "$range" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | ./githooks/commit-msg --subject-only >/dev/null
          done

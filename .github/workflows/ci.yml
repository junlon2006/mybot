name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev clang-format
      - name: Configure
        run: cmake -S . -B build -DCONFIG_PLATFORM=linux -DMYBOT_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Format check
        run: |
          find include src platforms examples tests -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror {} +

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-asan
            cc: gcc
            cxx: g++
            sanitizer: ASAN
            cmake_args: ''
          - name: clang-asan
            cc: clang
            cxx: clang++
            sanitizer: ASAN
            cmake_args: ''
          - name: gcc-ubsan
            cc: gcc
            cxx: g++
            sanitizer: UBSAN
            cmake_args: ''
          - name: gcc-asan-noaec
            cc: gcc
            cxx: g++
            sanitizer: ASAN
            cmake_args: -DMYBOT_CLOUD_AEC=OFF
          - name: gcc-asan-wake-words
            cc: gcc
            cxx: g++
            sanitizer: ASAN
            cmake_args: -DMYBOT_WAKE_WORDS=ON
          - name: gcc-asan-video
            cc: gcc
            cxx: g++
            sanitizer: ASAN
            cmake_args: -DMYBOT_ENABLE_VIDEO=ON -DMYBOT_BUILD_LINUX_PLATFORM=OFF -DMYBOT_BUILD_EXAMPLES=OFF
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libssl-dev clang-format clang cppcheck clang-tidy
      - name: Configure
        run: cmake -S . -B build -DCONFIG_PLATFORM=linux -DMYBOT_ENABLE_${{ matrix.sanitizer }}=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Format check
        if: matrix.name == 'gcc-asan'
        run: |
          find include src platforms/linux examples/linux tests -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror {} +
      - name: Static analysis (cppcheck)
        if: matrix.name == 'gcc-asan'
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 --std=c99 \
            -I include -I src/internal \
            -I third_party/aosl/include -I third_party/aosl/platform/include \
            -I third_party/aosl/platform/src/linux/config \
            src platforms/linux examples tests
      - name: Static analysis (clang-tidy)
        if: matrix.name == 'gcc-asan'
        run: |
          clang-tidy -p build $(find src platforms/linux examples/linux tests -name '*.c' \
            ! -path 'tests/integration/cmake_host/*' \
            ! -path 'tests/integration/cmake_install_consumer/*' \
            ! -path 'tests/unit/video_test.c' | sort)
          clang-tidy -p build/tests/cmake_host \
            tests/integration/cmake_host/main.c tests/integration/cmake_host/main.cpp
          clang-tidy -p build/install-consumer tests/integration/cmake_install_consumer/main.c
      - name: Static analysis (video)
        if: matrix.name == 'gcc-asan-video'
        run: |
          clang-tidy -p build src/media/mybot_video.c src/core/mybot_app.c \
            src/rtc/mybot_agora_rtc.c tests/unit/video_test.c \
            tests/unit/app_test.c tests/unit/platform_registry_test.c
      - name: Validate commit messages
        if: matrix.name == 'gcc-asan'
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git log --no-merges --format='%s' "$range" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | ./githooks/commit-msg --subject-only >/dev/null
          done

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libssl-dev lcov
      - name: Configure
        run: cmake -S . -B build -DCONFIG_PLATFORM=linux -DMYBOT_ENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --rc branch_coverage=1 --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info --output-file coverage.info \
            --rc branch_coverage=1 \
            '*/third_party/*' '*/tests/*' '*/platforms/*'
          lcov --summary coverage.info --rc branch_coverage=1 --fail-under-lines 80
          branch_rate=$(lcov --summary coverage.info --rc branch_coverage=1 | \
            awk -F'[:%]' '/branches/{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}')
          awk -v rate="$branch_rate" 'BEGIN { if (rate < 65) exit 1 }'
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v4.5.0
        with:
          files: coverage.info
          fail_ci_if_error: false


  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake doxygen
      - name: Configure
        run: cmake -S . -B build -DCONFIG_PLATFORM=linux -DMYBOT_BUILD_TESTS=OFF -DMYBOT_BUILD_EXAMPLES=OFF -DMYBOT_BUILD_LINUX_PLATFORM=OFF
      - name: Build API reference
        run: doxygen build/docs/Doxyfile
      - name: Upload API reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-reference
          path: build/docs/api/html
